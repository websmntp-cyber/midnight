<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C2B20">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Gol Arena Futsal – Booking Lapangan</title>
<script src="/assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.btn:hover{filter:brightness(0.93)}
.hero{background-size:cover;background-position:center 88%}
.hero-ov{background:linear-gradient(90deg,rgba(var(--ov),.94) 0%,rgba(var(--ov),.80) 36%,rgba(var(--ov),.38) 70%,rgba(var(--ov),.22) 100%),linear-gradient(0deg,rgba(var(--ov),.6) 0%,rgba(var(--ov),0) 32%)}
@media (max-width:720px){.hero{background-position:72% center}.hero-ov{background:linear-gradient(180deg,rgba(var(--ov),.82) 0%,rgba(var(--ov),.66) 55%,rgba(var(--ov),.82) 100%)}}
.hdr-nav a:hover{text-decoration:underline}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:860px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip-cell{flex-direction:column;align-items:flex-start!important;gap:10px!important;padding:16px 16px!important}.strip-val{font-size:24px!important}}
.court-card{transition:transform .2s ease,box-shadow .2s ease}
.court-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px rgba(0,0,0,.35)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.step-card{transition:transform .2s ease,box-shadow .2s ease}
.step-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.3)}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps-line{display:none}}
@media (max-width:520px){.steps{grid-template-columns:1fr;gap:14px}.step-card{flex-direction:row!important;align-items:flex-start;gap:16px!important;padding:20px 18px!important}.step-ic{width:48px!important;height:48px!important}.step-body{gap:6px!important}}
@media (prefers-reduced-motion:reduce){.court-card,.step-card{transition:none}.court-card:hover,.step-card:hover{transform:none}}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:720px){.hdr-nav{order:3;flex-basis:100%;overflow-x:auto}}
</style>
</helmet>
<div id="top" style="width:100%;font-family:'Barlow',system-ui,sans-serif;color:var(--tx);background:var(--bg)">

<!-- HEADER -->
<header style="background:var(--dk);color:var(--tx)">
<div style="max-width:1200px;margin:0 auto;padding:20px 24px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
<a href="#top" style="display:flex;align-items:center;gap:12px">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
<rect width="40" height="40" rx="10" fill="{{accent}}"/>
<g fill="none" stroke="#0C2B20" stroke-width="2.2" stroke-linejoin="round">
<rect x="8" y="11" width="24" height="18" rx="2"/>
<line x1="20" y1="11" x2="20" y2="29"/>
<circle cx="20" cy="20" r="4"/>
</g>
</svg>
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;letter-spacing:0.04em;text-transform:uppercase;line-height:1">{{ brandName }}</span>
</a>
<nav class="hdr-nav" aria-label="Navigasi utama" style="display:flex;gap:28px;font-weight:500;font-size:16px;white-space:nowrap">
<a href="#booking">Booking</a>
<a href="#booking" onClick="{{ openLookup }}">Cek booking</a>
<a href="#lapangan">Lapangan</a>
<a href="#harga">Harga</a>
<sc-if value="{{ hasFacilities }}" hint-placeholder-val="{{ false }}"><a href="#fasilitas">Fasilitas</a></sc-if>
<a href="#kontak">Kontak</a>
</nav>
<a class="btn" href="#booking" style="display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 20px;border-radius:999px;background:{{accent}};color:var(--onacc);font-weight:700;font-size:16px">Booking sekarang</a>
</div>
</header>

<!-- HERO -->
<section class="hero" aria-label="Beranda" style="position:relative;overflow:hidden;background-color:var(--dk0);background-image:{{ heroBg }};color:var(--tx)">
<div class="hero-ov" aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;left:0"></div>
<div style="position:relative;max-width:1200px;margin:0 auto;padding:clamp(48px,7vw,88px) 24px clamp(92px,9vw,112px);box-sizing:border-box;min-height:min(74vh,560px);display:flex;align-items:center">
<div style="max-width:780px;min-width:0;display:flex;flex-direction:column;gap:24px">
<span style="font-weight:600;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:{{accent}};text-shadow:0 1px 12px rgba(0,0,0,.6)">Sewa lapangan futsal · Booking online</span>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(52px,8vw,96px);line-height:0.95;letter-spacing:0.01em;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.5)">Pilih jam,<br>kunci lapangan,<br>langsung main.</h1>
<p style="margin:0;font-size:19px;line-height:1.55;color:var(--tx2);max-width:520px;text-shadow:0 1px 14px rgba(0,0,0,.6)">Cek jadwal kosong semua lapangan, pilih jam yang cocok, bayar DP, lalu dapatkan kode booking dan QR code.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">
<a class="btn" href="#booking" style="display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:0 28px;border-radius:999px;background:{{accent}};color:var(--onacc);font-weight:700;font-size:17px">Cek jadwal dan booking</a>
<a class="btn" href="#lapangan" style="display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:0 28px;border-radius:999px;border:1.5px solid rgba(243,245,238,.55);background:rgba(6,22,15,.35);color:var(--tx);font-weight:600;font-size:17px">Lihat lapangan</a>
</div>
</div>
</div>
</section>

<!-- STRIP INFO -->
<div style="position:relative;z-index:2;max-width:1200px;margin:-56px auto 0;padding:0 24px;box-sizing:border-box"><div class="strip" style="border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 44px rgba(6,22,15,.20);overflow:hidden"><div class="strip-cell" style="background:var(--glass);padding:20px 22px;display:flex;align-items:center;gap:14px;min-width:0"><span style="flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pillbd)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1.5"/><line x1="12" y1="6" x2="12" y2="18"/><circle cx="12" cy="12" r="2.6"/></svg></span><span style="display:flex;flex-direction:column;min-width:0"><span class="strip-val" style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;line-height:1.05;color:var(--tx);white-space:nowrap">{{ courtCountText }} lapangan</span><span style="font-size:14px;color:var(--tx2);line-height:1.3">Bisa dipesan per jam</span></span></div><div class="strip-cell" style="background:var(--glass);padding:20px 22px;display:flex;align-items:center;gap:14px;min-width:0"><span style="flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pillbd)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span style="display:flex;flex-direction:column;min-width:0"><span class="strip-val" style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;line-height:1.05;color:var(--tx);white-space:nowrap">{{ openShort }}</span><span style="font-size:14px;color:var(--tx2);line-height:1.3">Buka setiap hari</span></span></div><div class="strip-cell" style="background:var(--glass);padding:20px 22px;display:flex;align-items:center;gap:14px;min-width:0"><span style="flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pillbd)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="18" height="12" rx="2.5"/><path d="M3 10.5h18"/><path d="M16.5 14.5h1.5"/></svg></span><span style="display:flex;flex-direction:column;min-width:0"><span class="strip-val" style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;line-height:1.05;color:var(--tx);white-space:nowrap">{{ dpFromText }}</span><span style="font-size:14px;color:var(--tx2);line-height:1.3">DP mulai dari</span></span></div><div class="strip-cell" style="background:var(--glass);padding:20px 22px;display:flex;align-items:center;gap:14px;min-width:0"><span style="flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pillbd)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5M20 14v.01M14 20h3.5M20 17v3"/></svg></span><span style="display:flex;flex-direction:column;min-width:0"><span class="strip-val" style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;line-height:1.05;color:var(--tx);white-space:nowrap">Tiket QR</span><span style="font-size:14px;color:var(--tx2);line-height:1.3">Kode booking instan</span></span></div></div></div>

<!-- BOOKING -->
<section id="booking" style="background:var(--bg);position:relative;overflow:hidden">
<svg aria-hidden="true" viewBox="0 0 600 400" style="position:absolute;right:-160px;top:40px;width:min(620px,70vw);height:auto;opacity:.07;pointer-events:none" fill="none" stroke="#1F6B45" stroke-width="3"><rect x="10" y="10" width="580" height="380" rx="8"/><line x1="300" y1="10" x2="300" y2="390"/><circle cx="300" cy="200" r="64"/><path d="M10 100a96 96 0 0 1 96 96v8a96 96 0 0 1-96 96"/><path d="M590 100a96 96 0 0 0-96 96v8a96 96 0 0 0 96 96"/></svg>
<div style="position:relative;max-width:1200px;margin:0 auto;padding:88px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:12px;max-width:640px">
<span style="font-weight:600;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)">Booking</span>
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(40px,5vw,60px);line-height:1;text-transform:uppercase">Booking lapangan</h2>
<p style="margin:0;font-size:18px;line-height:1.55;color:var(--tx2)">Pilih tanggal, lapangan, lalu jam main. Jam yang sudah terisi otomatis terkunci, dan akan terbuka lagi kalau booking dibatalkan.</p>
</div>

<div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
<div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:36px">

<div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
<span style="width:32px;height:32px;border-radius:50%;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;border:1px solid var(--pillbd)">1</span>
<h3 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase">Pilih tanggal</h3>
</div>
<div role="group" aria-label="Pilih tanggal" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px">
<sc-for list="{{ days }}" as="day" hint-placeholder-count="14">
<button type="button" onClick="{{ day.pick }}" aria-pressed="{{ day.pressed }}" style="flex:0 0 auto;min-width:76px;min-height:80px;box-sizing:border-box;padding:10px 8px;border-width:1.5px;border-style:solid;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;{{ day.css }}">
<span style="font-size:13px;font-weight:600">{{ day.dow }}</span>
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1">{{ day.num }}</span>
<span style="font-size:13px;font-weight:500">{{ day.mon }}</span>
</button>
</sc-for>
</div>
</div>

<div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
<span style="width:32px;height:32px;border-radius:50%;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;border:1px solid var(--pillbd)">2</span>
<h3 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase">Pilih lapangan</h3>
</div>
<div role="group" aria-label="Pilih lapangan" style="display:flex;flex-wrap:wrap;gap:12px">
<sc-for list="{{ courts }}" as="court" hint-placeholder-count="3">
<button type="button" onClick="{{ court.pick }}" aria-pressed="{{ court.pressed }}" style="flex:1 1 160px;min-height:68px;box-sizing:border-box;padding:12px 16px;border-width:1.5px;border-style:solid;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;font-family:inherit;{{ court.css }}">
<span style="font-weight:700;font-size:17px">{{ court.name }}</span>
<sc-if value="{{ court.hasType }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px">{{ court.type }}</span></sc-if>
</button>
</sc-for>
</div>
</div>

<div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
<span style="width:32px;height:32px;border-radius:50%;background:var(--pill);color:{{accent}};display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;border:1px solid var(--pillbd)">3</span>
<h3 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase">Pilih jam main</h3>
</div>
<div role="group" aria-label="Pilih jam main" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px">
<sc-for list="{{ slots }}" as="slot" hint-placeholder-count="14">
<button type="button" disabled="{{ slot.unavailable }}" onClick="{{ slot.toggle }}" aria-pressed="{{ slot.pressed }}" aria-label="{{ slot.aria }}" style="min-height:56px;box-sizing:border-box;border-width:1.5px;border-style:solid;border-radius:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;{{ slot.css }}">
<span style="font-weight:700;font-size:16px">{{ slot.label }}</span>
<span style="font-size:12px">{{ slot.sub }}</span>
</button>
</sc-for>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:16px;font-size:14px;color:var(--tx2)">
<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--glass);border:1.5px solid var(--line2)"></span>Tersedia</span>
<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--fill)"></span>Dipilih</span>
<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--dim)"></span>Tidak tersedia</span>
</div>
<p style="margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--tx2)">{{ priceLineWeekday }}<br>{{ priceLineWeekend }}</p>
</div>

</div>

<aside aria-label="Ringkasan booking" style="flex:1 1 340px;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">

<!-- PANEL: RINGKASAN -->
<sc-if value="{{ showSelect }}" hint-placeholder-val="{{ true }}">
<h3 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase">Ringkasan</h3>
<div style="display:flex;flex-direction:column;gap:12px;font-size:16px">
<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:var(--tx2)">Tanggal</span><span style="font-weight:600;text-align:right">{{ dateLong }}</span></div>
<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:var(--tx2)">Lapangan</span><span style="font-weight:600;text-align:right">{{ courtName }}</span></div>
<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:var(--tx2)">Jam</span><span style="font-weight:600;text-align:right">{{ hoursText }}</span></div>
<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:var(--tx2)">Durasi</span><span style="font-weight:600;text-align:right">{{ durText }}</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line)">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
<span style="font-weight:600;font-size:16px">Total</span>
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1">{{ totalText }}</span>
</div>
<div style="display:flex;justify-content:space-between;gap:16px;font-size:15px"><span style="color:var(--tx2)">DP minimum ({{ dayTypeText }})</span><span style="font-weight:700">{{ dpMinText }}</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="nama" style="font-weight:600;font-size:15px">Nama pemesan <span style="font-weight:500;color:var(--tx2)">(wajib)</span></label>
<input id="nama" type="text" autocomplete="name" required value="{{ name }}" onChange="{{ onName }}" aria-invalid="{{ nameInvalid }}" placeholder="Nama tim atau pemesan" style="min-height:48px;box-sizing:border-box;padding:0 14px;border:1.5px solid var(--line2);border-radius:10px;font-family:inherit;font-size:16px;color:var(--tx);background:var(--glass2)">
<sc-if value="{{ hasNameError }}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size:14px;color:var(--err-tx)">{{ nameError }}</span></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="wa" style="font-weight:600;font-size:15px">Nomor WhatsApp <span style="font-weight:500;color:var(--tx2)">(wajib)</span></label>
<input id="wa" type="tel" autocomplete="tel" required value="{{ phone }}" onChange="{{ onPhone }}" aria-invalid="{{ phoneInvalid }}" placeholder="08xx xxxx xxxx" style="min-height:48px;box-sizing:border-box;padding:0 14px;border:1.5px solid var(--line2);border-radius:10px;font-family:inherit;font-size:16px;color:var(--tx);background:var(--glass2)">
<sc-if value="{{ hasPhoneError }}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size:14px;color:var(--err-tx)">{{ phoneError }}</span></sc-if>
</div>
<sc-if value="{{ hasFormError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin:0;padding:12px 14px;border-radius:10px;background:var(--err-bg);color:var(--err-tx);font-size:15px;line-height:1.5">{{ formError }}</p>
</sc-if>
<button type="button" class="btn" disabled="{{ startDisabled }}" onClick="{{ startPay }}" style="min-height:52px;box-sizing:border-box;border:none;border-radius:999px;padding:0 24px;font-family:inherit;font-weight:700;font-size:17px;{{ startCss }}">Lanjut bayar DP</button>
<p style="margin:0;font-size:14px;line-height:1.5;color:var(--tx2)">Jam yang kamu pilih ditahan {{ holdText }} menit setelah lanjut ke pembayaran. Booking terkonfirmasi setelah admin memeriksa bukti transfer.</p>
<button type="button" onClick="{{ openLookup }}" style="align-self:flex-start;min-height:44px;padding:0 2px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:15px;text-decoration:underline;cursor:pointer">Sudah punya kode booking? Cek atau batalkan</button>
</sc-if>

<!-- PANEL: BAYAR DP -->
<sc-if value="{{ showPay }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h3 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase">Bayar DP</h3>
<span style="padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-tx);font-weight:700;font-size:14px">Sisa {{ pay.left }}</span>
</div>
<div style="background:var(--glass2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:15px">
<span style="font-weight:700;font-size:17px">{{ pay.court }}</span>
<span style="color:var(--tx2)">{{ pay.dateText }} · {{ pay.hoursText }}</span>

<div>

</div>
<p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--tx2)">Sisa pembayaran {{ pay.remainText }} dilunasi di lokasi.</p>

<div style="border:1.5px dashed var(--line2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px">

</sc-if>

<!-- PANEL: TIKET -->

</div>

<sc-if value="{{ tk.canCancel }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ askingCancel }}" hint-placeholder-val="{{ false }}">
<div role="alertdialog" aria-label="Konfirmasi pembatalan" style="padding:16px;border:1.5px solid var(--err-tx);border-radius:14px;display:flex;flex-direction:column;gap:12px">

<button type="button" class="btn" onClick="{{ keepBooking }}" style="flex:1 1 140px;min-height:48px;border:1.5px solid var(--line2);border-radius:999px;background:transparent;color:var(--tx);font-weight:700;font-size:15px;cursor:pointer">Tidak, simpan</button>
</div>
</div>
</sc-if>
<sc-if value="{{ notAskingCancel }}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" onClick="{{ askCancel }}" style="min-height:48px;border:1.5px solid var(--err-tx);border-radius:999px;background:transparent;color:var(--err-tx);font-weight:700;font-size:15px;cursor:pointer">Batalkan booking</button>

</sc-if>

<button type="button" onClick="{{ resetAll }}" style="align-self:flex-start;min-height:44px;padding:0 2px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:15px;text-decoration:underline;cursor:pointer">Buat booking baru</button>

<!-- PANEL: CEK BOOKING -->
<sc-if value="{{ showLookup }}" hint-placeholder-val="{{ false }}">

<p style="margin:0;font-size:15px;line-height:1.6;color:var(--tx2)">Masukkan kode booking dan nomor WhatsApp yang dipakai saat booking untuk melihat tiket atau membatalkan.</p>

</div>
</div>

    const list = this.mineGet().filter((x) => x.code !== b.code);
    list.push({ id: b.id, code: b.code, token: token });
    try { window.localStorage.setItem('golarena.mine', JSON.stringify(list.slice(-20))); } catch (e) { /* mode privat */ }
  }
  tokenOf(code) {
    if (this._tokens[code]) return this._tokens[code];
    const m = this.mineGet().find((x) => x.code === code);
    return m ? m.token : '';
  }

  async api(method, path, body) {
    let res;
    try {
      res = await fetch(path, { method: method, headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    } catch (e) {
      return { ok: false, status: 0, error: 'Tidak bisa terhubung ke server. Periksa internet kamu lalu coba lagi.' };
    }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) return { ok: false, status: res.status, code: data && data.code, error: (data && data.error) || 'Terjadi kesalahan. Coba lagi sebentar.' };
    return { ok: true, status: res.status, data: data };
  }

  async sync() {
    if (this._syncing) return;
    this._syncing = true;
    this._lastSync = Date.now();
    try {
      const r = await this.api('GET', '/api/public?days=15');
      if (!r.ok) { if (!this.state.loaded) this.setState({ netError: r.error }); return; }
      const p = r.data;
      this._skew = p.now - Date.now();
      const base = this.defaults().settings;
      const s = Object.assign({}, base, p.settings);
      const pc = Array.isArray(p.settings.courts) ? p.settings.courts : [];
      s.courts = base.courts.map((c, i) => Object.assign({}, c, pc[i] || {}));
      const own = this.state.data.bookings.filter((b) => b.__own);
      const stubs = (p.taken || []).map((t, i) => ({ id: 'x' + i, code: '', name: '', phone: '', court: t.court, date: t.date, hours: t.hours, total: 0, dpMin: 0, dpPaid: 0, status: t.status, holdUntil: t.holdUntil, createdAt: 0 }));
      this.setState({ data: { v: 1, settings: s, bookings: own.concat(stubs), blocked: p.blocked || {} }, loaded: true, netError: '', tick: this.now() });
    } finally {
      this._syncing = false;
    }
  }

  netTick() {
    if (typeof document !== 'undefined' && document.hidden) return;
    const S = this.state;
    const t = Date.now();
    const own = S.activeId ? S.data.bookings.find((b) => b.id === S.activeId) : null;
    if (S.stage === 'select' || !own) { if (t - this._lastSync >= 20000) this.sync(); return; }
    if (t - this._lastOwn >= 8000) this.refreshOwn();
    if (t - this._lastSync >= 30000) this.sync();
  }

  replaceOwn(b) {
    const o = Object.assign({}, b, { __own: true });
    this.setState((S) => ({ data: Object.assign({}, S.data, { bookings: [o].concat(S.data.bookings.filter((x) => x.id !== o.id)) }) }));
  }

  async refreshOwn() {
    const S = this.state;
    const b = S.activeId ? S.data.bookings.find((x) => x.id === S.activeId) : null;
    if (!b || !b.code) return;
    this._lastOwn = Date.now();
    const r = await this.api('POST', '/api/ticket', { code: b.code, token: this.tokenOf(b.code) });
    if (r.ok) { if (r.data.now) this._skew = r.data.now - Date.now(); this.replaceOwn(r.data.booking); }
  }

  /* ---------- helper umum ---------- */
  pad(n) { return n < 10 ? '0' + n : '' + n; }
  dkey(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); }
  parseKey(k) { const a = String(k).split('-'); return new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2])); }
  isWeekend(k) { const g = this.parseKey(k).getDay(); return g === 0 || g === 6; }
  fmt(n) { return 'Rp ' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  hh(h) { return this.pad(h) + '.00'; }

  normPhone(raw) {
    let p = String(raw || '').replace(/[^0-9]/g, '');
    if (p.indexOf('0') === 0) p = '62' + p.slice(1);
    else if (p.indexOf('8') === 0) p = '62' + p;
    return p;
  }
  validPhone(p) { return /^628[0-9]{8,11}$/.test(p); }
  sane(raw) {
    const s = Object.assign({}, raw);
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    s.openHour = clamp(Number(raw.openHour) || 0, 0, 23);
    s.closeHour = clamp(Number(raw.closeHour) || 0, s.openHour + 1, 24);
    s.nightFrom = clamp(Number(raw.nightFrom) || 0, s.openHour, s.closeHour);
    return s;
  }
  fmtPhone(p) {
    if (!p) return '';
    const l = p.indexOf('62') === 0 ? '0' + p.slice(2) : p;
    return l.replace(/^(\d{4})(\d{4})(\d+)$/, '$1-$2-$3');
  }

  priceOf(k, h, s) {
    const we = this.isWeekend(k);
    const night = h >= s.nightFrom;
    if (we) return night ? s.priceWeekendNight : s.priceWeekendDay;
    return night ? s.priceWeekdayNight : s.priceWeekdayDay;
  }
  totalOf(k, hours, s) { return hours.reduce((t, h) => t + this.priceOf(k, h, s), 0); }
  dpMinOf(k, total, s) { return Math.min(this.isWeekend(k) ? s.dpWeekend : s.dpWeekday, total); }
  dpAmounts(b) {
    return {
      min: Math.min(b.dpMin, b.total),
      half: Math.min(b.total, Math.max(b.dpMin, Math.round(b.total / 2000) * 1000)),
      full: b.total,
    };
  }

  effStatus(b, nowMs) {
    if (b.status === 'wait' && b.holdUntil < nowMs) return 'expired';
    return b.status;
  }
  isActive(st) { return st === 'wait' || st === 'verify' || st === 'ok'; }
  takenMap(d, k, nowMs) {
    const m = {};
    d.bookings.forEach((b) => {
      if (b.date !== k) return;
      if (!this.isActive(this.effStatus(b, nowMs))) return;
      b.hours.forEach((h) => { m[b.court + '-' + h] = b; });
    });
    return m;
  }

  rangesText(hours) {
    const sorted = hours.slice().sort((a, b) => a - b);
    const ranges = [];
    sorted.forEach((h) => {
      const last = ranges[ranges.length - 1];
      if (last && last.end === h) last.end = h + 1; else ranges.push({ start: h, end: h + 1 });
    });
    return ranges.map((r) => this.hh(r.start) + '–' + this.hh(r.end)).join(', ');
  }

  dateLongOf(k) {
    const dayLong = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const monthLong = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const d = this.parseKey(k);
    return dayLong[d.getDay()] + ', ' + d.getDate() + ' ' + monthLong[d.getMonth()] + ' ' + d.getFullYear();
  }

  genCode(d) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let t = 0; t < 60; t++) {
      let c = 'GA-';
      for (let i = 0; i < 5; i++) c += A.charAt(Math.floor(Math.random() * A.length));
      if (!d.bookings.some((b) => b.code === c)) return c;
    }
    return 'GA-' + Date.now().toString(36).toUpperCase().slice(-5);
  }

  readImage(file, maxW, q, cb) {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r));
        c.height = Math.max(1, Math.round(img.height * r));
        const g = c.getContext('2d');
        g.fillStyle = '#FFFFFF';
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        let out = '';
        try { out = c.toDataURL('image/jpeg', q); } catch (e) { out = ''; }
        cb(out);
      };
      img.onerror = () => cb('');
      img.src = fr.result;
    };
    fr.onerror = () => cb('');
    fr.readAsDataURL(file);
  }

  // Isi QR: detail booking + jumlah yang sudah dibayar, supaya admin bisa melihat sisa pembayaran saat scan.
  // Format: GA1|kode|nama|whatsapp|lapangan|yymmdd|jam (mulai-selesai, dipisah koma)|total|dibayar
  qrText(b) {
    return 'GOLARENA:' + b.code;
  }

  makeQr(text) {
    const bytes = [];
    for (let i = 0; i < text.length; i++) bytes.push(text.charCodeAt(i) & 255);
    const EC = [null, [10, 1, 26], [16, 1, 44], [26, 1, 70], [18, 2, 100], [24, 2, 134], [16, 4, 172]];
    const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34]];
    let ver = 0;
    for (let v = 1; v <= 6; v++) {
      const e = EC[v];
      if (bytes.length <= e[2] - e[0] * e[1] - 2) { ver = v; break; }
    }
    if (!ver) return null;
    const ecLen = EC[ver][0];
    const nb = EC[ver][1];
    const dataCW = EC[ver][2] - ecLen * nb;
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4);
    put(bytes.length, 8);
    bytes.forEach((b) => put(b, 8));
    const capBits = dataCW * 8;
    put(0, Math.min(4, capBits - bits.length));
    while (bits.length % 8) bits.push(0);
    let pi = 0;
    while (bits.length < capBits) { put(pi % 2 === 0 ? 0xEC : 0x11, 8); pi++; }
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      data.push(b);
    }
    const exp = new Array(512);
    const log = new Array(256);
    let gx = 1;
    for (let i = 0; i < 255; i++) { exp[i] = gx; log[gx] = i; gx <<= 1; if (gx & 256) gx ^= 285; }
    for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
    const mul = (a, b) => (a === 0 || b === 0 ? 0 : exp[log[a] + log[b]]);
    const genPoly = (n) => {
      let g = [1];
      for (let i = 0; i < n; i++) {
        const ng = new Array(g.length + 1).fill(0);
        for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], exp[i]); }
        g = ng;
      }
      return g;
    };
    const rs = (blk, n) => {
      const g = genPoly(n);
      const res = new Array(n).fill(0);
      blk.forEach((b) => {
        const f = b ^ res[0];
        res.shift();
        res.push(0);
        if (f !== 0) for (let i = 0; i < n; i++) res[i] ^= mul(g[i + 1], f);
      });
      return res;
    };
    const per = dataCW / nb;
    const dbl = [];
    const ebl = [];
    for (let i = 0; i < nb; i++) {
      const blk = data.slice(i * per, (i + 1) * per);
      dbl.push(blk);
      ebl.push(rs(blk, ecLen));
    }
    const words = [];
    for (let i = 0; i < per; i++) dbl.forEach((b) => words.push(b[i]));
    for (let i = 0; i < ecLen; i++) ebl.forEach((b) => words.push(b[i]));
    const size = ver * 4 + 17;
    const mod = [];
    const fn = [];
    for (let r = 0; r < size; r++) { mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const setF = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(i, 6, i % 2 === 0); setF(6, i, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          const x = cx + dx;
          const y = cy + dy;
          if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, dist !== 2 && dist !== 4);
        }
      }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    const ap = ALIGN[ver];
    for (let i = 0; i < ap.length; i++) {
      for (let j = 0; j < ap.length; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) setF(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }
    const drawFormat = (mask) => {
      const d5 = mask;
      let rem = d5;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const fb = ((d5 << 10) | rem) ^ 0x5412;
      const bit = (i) => ((fb >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6));
      setF(8, 8, bit(7));
      setF(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    let bi = 0;
    const totalBits = words.length * 8;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!fn[y][x] && bi < totalBits) {
            mod[y][x] = ((words[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0;
            bi++;
          }
        }
      }
    }
    const applyMask = (m) => {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          let inv = false;
          if (m === 0) inv = (x + y) % 2 === 0;
          else if (m === 1) inv = y % 2 === 0;
          else if (m === 2) inv = x % 3 === 0;
          else if (m === 3) inv = (x + y) % 3 === 0;
          else if (m === 4) inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
          else if (m === 5) inv = ((x * y) % 2) + ((x * y) % 3) === 0;
          else if (m === 6) inv = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
          else inv = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
          if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
        }
      }
    };
    const penalty = () => {
      let p = 0;
      const lines = [];
      for (let i = 0; i < size; i++) {
        let row = '';
        let col = '';
        for (let j = 0; j < size; j++) { row += mod[i][j] ? '1' : '0'; col += mod[j][i] ? '1' : '0'; }
        lines.push(row, col);
      }
      lines.forEach((s) => {
        const runs = s.match(/0+|1+/g) || [];
        runs.forEach((r) => { if (r.length >= 5) p += 3 + (r.length - 5); });
        const m1 = s.match(/(?=10111010000)/g);
        const m2 = s.match(/(?=00001011101)/g);
        p += 40 * ((m1 ? m1.length : 0) + (m2 ? m2.length : 0));
      });
      for (let y = 0; y < size - 1; y++) {
        for (let x = 0; x < size - 1; x++) {
          const c = mod[y][x];
          if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
        }
      }
      let dark = 0;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (mod[y][x]) dark++;
      const k = Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1;
      p += Math.max(0, k) * 10;
      return p;
    };
    let best = 0;
    let bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const p = penalty();
      if (p < bestP) { bestP = p; best = m; }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);
    let path = '';
    for (let y = 0; y < size; y++) {
      let x = 0;
      while (x < size) {
        if (mod[y][x]) {
          let e = x;
          while (e < size && mod[y][e]) e++;
          path += 'M' + x + ' ' + y + 'h' + (e - x) + 'v1h-' + (e - x) + 'z';
          x = e;
        } else x++;
      }
    }
    return { size: size, version: ver, path: path, modules: mod };
  }

  /* ---------- aksi pelanggan ---------- */
  async startPay() {
    const S = this.state;
    if (this._busy) return;
    const now = new Date(this.now());
    const key = this.dkey(new Date(now.getFullYear(), now.getMonth(), now.getDate() + S.dateIdx));
    const name = S.name.trim();
    const phone = this.normPhone(S.phone);
    if (name.length < 2 || !this.validPhone(phone) || !S.picked.length) {
      this.setState({ submitted: true });
      return;
    }
    if (!S.loaded) {
      this.setState({ formError: 'Jadwal belum termuat. Tunggu sebentar lalu coba lagi.' });
      this.sync();
      return;
    }
    const hours = S.picked.slice().sort((a, b) => a - b);
    this._busy = true;
    this.setState({ busy: true, formError: '' });
    const r = await this.api('POST', '/api/book', { name: name, phone: S.phone, court: S.courtIdx, date: key, hours: hours });
    this._busy = false;
    if (!r.ok) {
      const clear = r.code === 'conflict' || r.code === 'past';
      this.setState({ busy: false, formError: r.error, picked: clear ? [] : S.picked });
      if (clear) this.sync();
      return;
    }
    this.mineAdd(r.data.booking, r.data.token);
    this.replaceOwn(r.data.booking);
    this.setState({ busy: false, stage: 'pay', activeId: r.data.booking.id, submitted: false, formError: '', dpChoice: 'min', proof: '', proofName: '', proofError: '', picked: [], confirmCancel: false });
    this.sync();
  }

  async submitProof() {
    const S = this.state;
    if (!S.proof || this._busy) return;
    const b = S.data.bookings.find((x) => x.id === S.activeId);
    if (!b) { this.setState({ proofError: 'Booking tidak ditemukan.' }); return; }
    this._busy = true;
    this.setState({ busy: true, proofError: '' });
    const r = await this.api('POST', '/api/proof', { code: b.code, token: this.tokenOf(b.code), proof: S.proof, choice: S.dpChoice });
    this._busy = false;
    if (!r.ok) {
      this.setState({ busy: false, proofError: r.error });
      this.refreshOwn();
      return;
    }
    this.replaceOwn(r.data.booking);
    this.setState({ busy: false, stage: 'ticket', proof: '', proofName: '', proofError: '', confirmCancel: false });
    this.sync();
  }

  async cancelBooking(id) {
    const b = this.state.data.bookings.find((x) => x.id === id);
    if (!b || !b.code) return;
    const r = await this.api('POST', '/api/cancel', { code: b.code, token: this.tokenOf(b.code) });
    if (r.ok) this.replaceOwn(r.data.booking);
    else if (r.code === 'inactive') this.refreshOwn();
    else this.setState({ proofError: r.error });
    this.sync();
  }

  async lookupBooking() {
    const S = this.state;
    const code = S.lookupCode.trim().toUpperCase();
    if (!code || !S.lookupPhone.trim()) {
      this.setState({ lookupError: 'Isi kode booking dan nomor WhatsApp yang dipakai saat memesan.' });
      return;
    }
    const r = await this.api('POST', '/api/lookup', { code: code, phone: S.lookupPhone });
    if (!r.ok) { this.setState({ lookupError: r.error }); return; }
    if (r.data.now) this._skew = r.data.now - Date.now();
    this.mineAdd(r.data.booking, r.data.token);
    this.replaceOwn(r.data.booking);
    const st = this.effStatus(r.data.booking, this.now());
    this.setState({ activeId: r.data.booking.id, stage: st === 'wait' ? 'pay' : 'ticket', lookupError: '', confirmCancel: false, dpChoice: 'min', proof: '', proofName: '', proofError: '' });
  }

  resetFlow() {
    this.setState({
      stage: 'select', activeId: '', picked: [], submitted: false, formError: '',
      dpChoice: 'min', proof: '', proofName: '', proofError: '',
      lookupError: '', confirmCancel: false,
    });
  }

  renderVals() {
    const accent = 'var(--fill)';
    const S = this.state;
    const d = S.data;
    const s = this.sane(d.settings);
    const nowMs = S.tick;
    const now = new Date(nowMs);
    const fmt = (n) => this.fmt(n);
    const hh = (h) => this.hh(h);
    const dayShort = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
    const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const todayKey = this.dkey(now);
    const cname = (i) => (s.courts[i] && s.courts[i].name ? s.courts[i].name : 'Lapangan ' + (i + 1));
    const brandName = (s.name || '').trim() || 'Gol Arena Futsal';

    const ON_DARK = 'background:var(--fill);color:var(--onacc);border-color:var(--fill);';
    const OFF_LIGHT = 'background:var(--glass);color:var(--tx);border-color:var(--line2);';
    const OFF_DIM = 'background:var(--dim);color:var(--tx3);border-color:var(--line);cursor:not-allowed;';

    // ---- tanggal, lapangan, jam ----
    const days = [];
    for (let i = 0; i < 14; i++) {
      const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const on = i === S.dateIdx;
      days.push({
        key: this.dkey(dt),
        dow: i === 0 ? 'Hari ini' : dayShort[dt.getDay()],
        num: String(dt.getDate()),
        mon: monthShort[dt.getMonth()],
        pressed: on,
        css: on ? ON_DARK : OFF_LIGHT,
        pick: () => this.setState({ dateIdx: i, picked: [], formError: '' }),
      });
    }
    const dateKey = days[S.dateIdx].key;
    const courts = [0, 1, 2].map((i) => {
      const on = i === S.courtIdx;
      const t = (s.courts[i].type || '').trim();
      return {
        name: cname(i),
        type: t,
        hasType: !!t,
        pressed: on,
        css: on ? ON_DARK : OFF_LIGHT,
        pick: () => this.setState({ courtIdx: i, picked: [], formError: '' }),
      };
    });

    const taken = this.takenMap(d, dateKey, nowMs);
    const slots = [];
    const free = [];
    for (let h = s.openHour; h < s.closeHour; h++) {
      const bk = taken[S.courtIdx + '-' + h];
      const blocked = !!d.blocked[dateKey + '|' + S.courtIdx + '|' + h];
      const past = dateKey === todayKey && h <= now.getHours();
      const unavailable = !!bk || blocked || past;
      if (!unavailable) free.push(h);
      const on = !unavailable && S.picked.indexOf(h) !== -1;
      const price = this.priceOf(dateKey, h, s);
      const priceShort = (price % 1000 === 0 ? String(price / 1000) : (price / 1000).toFixed(1).replace('.', ',')) + 'rb';
      const sub = bk ? 'Terisi' : blocked ? 'Tutup' : past ? 'Lewat' : priceShort;
      slots.push({
        label: hh(h),
        sub: sub,
        unavailable: unavailable,
        pressed: on,
        aria: hh(h) + ' sampai ' + hh(h + 1) + (unavailable ? ', tidak tersedia' : on ? ', dipilih' : ', tersedia, ' + fmt(price)),
        css: unavailable ? OFF_DIM : on ? ON_DARK : OFF_LIGHT,
        toggle: () => {
          const cur = this.state.picked.slice();
          const k = cur.indexOf(h);
          if (k === -1) cur.push(h); else cur.splice(k, 1);
          cur.sort((a, b) => a - b);
          this.setState({ picked: cur, formError: '' });
        },
      });
    }
    const picked = S.picked.filter((h) => free.indexOf(h) !== -1).sort((a, b) => a - b);
    const total = this.totalOf(dateKey, picked, s);
    const dpMin = this.dpMinOf(dateKey, total, s);
    const weekend = this.isWeekend(dateKey);

    // ---- validasi form ----
    const nameTrim = S.name.trim();
    const phoneN = this.normPhone(S.phone);
    const nameErr = S.submitted && nameTrim.length < 2 ? 'Nama pemesan wajib diisi.' : '';
    const phoneErr = S.submitted && !this.validPhone(phoneN)
      ? (S.phone.trim() ? 'Nomor WhatsApp tidak valid. Contoh: 0812 3456 7890.' : 'Nomor WhatsApp wajib diisi.')
      : '';

    // ---- booking aktif dan tahap panel ----
    const ab = d.bookings.find((b) => b.id === S.activeId) || null;
    const abSt = ab ? this.effStatus(ab, nowMs) : '';
    let stage = S.stage;
    if ((stage === 'pay' || stage === 'ticket') && !ab) stage = 'select';
    if (stage === 'pay' && ab && abSt !== 'wait' && abSt !== 'expired') stage = 'ticket';
    if (stage === 'ticket' && ab && abSt === 'wait') stage = 'pay';

    const waNum = this.normPhone(s.whatsapp);
    const waBase = 'https://wa.me/' + waNum + '?text=';
    let pay = { left: '', court: '', dateText: '', hoursText: '', name: '', totalText: '', remainText: '', waUrl: waBase };
    let dpOptions = [];
    let dpAmountText = '';
    let tk = { code: '', hasQr: false, noQr: true, qrBox: '', qrPath: '', statusLabel: '', badgeCss: '', message: '', name: '', court: '', dateText: '', hoursText: '', totalText: '', dpText: '', remainText: '', waUrl: waBase, canCancel: false };
    if (ab) {
      const amounts = this.dpAmounts(ab);
      const chosen = amounts[S.dpChoice] !== undefined ? amounts[S.dpChoice] : amounts.min;
      const leftMs = Math.max(0, ab.holdUntil - nowMs);
      const mm = Math.floor(leftMs / 60000);
      const ss = Math.floor((leftMs % 60000) / 1000);
      const hoursText = this.rangesText(ab.hours);
      const dateText = this.dateLongOf(ab.date);
      const waMsg = 'Halo ' + brandName + ', saya ' + ab.name + '. Kode booking ' + ab.code + ' (' + cname(ab.court) + ', ' + dateText + ', ' + hoursText + ').';
      pay = {
        left: this.pad(mm) + ':' + this.pad(ss),
        court: cname(ab.court),
        dateText: dateText,
        hoursText: hoursText,
        name: ab.name,
        totalText: fmt(ab.total),
        remainText: fmt(ab.total - chosen),
        waUrl: waBase + encodeURIComponent(waMsg),
      };
      dpAmountText = fmt(chosen);
      dpOptions = [['min', 'DP minimum'], ['half', '50% dari total'], ['full', 'Bayar lunas']].map((o) => ({
        label: o[1],
        amountText: fmt(amounts[o[0]]),
        pressed: S.dpChoice === o[0],
        css: S.dpChoice === o[0] ? ON_DARK : OFF_LIGHT,
        pick: () => this.setState({ dpChoice: o[0] }),
      }));
      let label = 'Menunggu verifikasi';
      let css = 'background:var(--warn-bg);color:var(--warn-tx);';
      let message = 'Bukti transfer sudah kami terima. Admin akan memeriksanya, lalu statusnya berubah menjadi Terkonfirmasi. Simpan atau tangkap layar tiket ini.';
      if (abSt === 'ok') { label = 'Terkonfirmasi'; css = 'background:var(--ok-bg);color:var(--ok-tx);'; message = 'Booking kamu sudah terkonfirmasi. Tunjukkan QR code atau kode booking ini kepada admin di lokasi.'; }
      else if (abSt === 'rej') { label = 'Bukti ditolak'; css = 'background:var(--err-bg);color:var(--err-tx);'; message = 'Bukti transfer belum bisa diterima admin dan jam kamu sudah dilepas. Hubungi admin lewat WhatsApp untuk bantuan.'; }
      else if (abSt === 'cancel') { label = 'Dibatalkan'; css = 'background:var(--dim);color:var(--tx2);'; message = ab.cancelledBy === 'admin' ? 'Booking ini dibatalkan oleh admin dan jamnya sudah dilepas.' : 'Booking dibatalkan. Jam yang kamu pilih sudah dilepas dan bisa dipesan orang lain.'; }
      else if (abSt === 'expired') { label = 'Kedaluwarsa'; css = 'background:var(--dim);color:var(--tx2);'; message = 'Batas waktu pembayaran sudah lewat dan jamnya dilepas.'; }
      const hasQr = abSt === 'verify' || abSt === 'ok';
      const q = hasQr ? this.makeQr(this.qrText(ab)) : null;
      tk = {
        code: ab.code,
        hasQr: !!q,
        noQr: !q,
        qrBox: q ? '0 0 ' + (q.size + 8) + ' ' + (q.size + 8) : '0 0 1 1',
        qrPath: q ? q.path : '',
        statusLabel: label,
        badgeCss: css,
        message: message,
        name: ab.name,
        court: cname(ab.court),
        dateText: dateText,
        hoursText: hoursText,
        totalText: fmt(ab.total),
        dpText: ab.dpPaid > 0 ? fmt(ab.dpPaid) : '–',
        remainText: ab.dpPaid > 0 && (abSt === 'verify' || abSt === 'ok') ? fmt(ab.total - ab.dpPaid) : '–',
        waUrl: waBase + encodeURIComponent(waMsg),
        canCancel: this.isActive(abSt),
      };
    }

    // ---- kontak, harga, fasilitas ----
    const hasBank = !!((s.bankName || '').trim() || (s.bankNumber || '').trim());
    const bankLine = [(s.bankName || '').trim(), (s.bankNumber || '').trim()].filter((x) => x).join(' · ');
    const igHandle = (s.instagram || '').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/\/.*$/, '');
    const facilityItems = (s.facilities || '').split('\n').map((x) => x.trim()).filter((x) => x).map((x) => ({ text: x }));
    const policy = (s.policy || '').trim();
    const rangeDay = hh(s.openHour) + '–' + hh(s.nightFrom);
    const rangeNight = hh(s.nightFrom) + '–' + hh(s.closeHour);
    const tones = ['#16573C', '#1B6B49', '#2A5B7C'];
    const courtCards = [0, 1, 2].map((i) => {
      const t = (s.courts[i].type || '').trim();
      const photo = s.courts[i].photo || '';
      return {
        name: cname(i),
        type: t,
        hasType: !!t,
        photo: photo,
        hasPhoto: !!photo,
        noPhoto: !photo,
        tone: tones[i],
        choose: () => this.setState({ courtIdx: i, picked: [], formError: '', stage: 'select' }),
      };
    });

    return {
      accent: accent,
      brandName: brandName,
      hasFacilities: facilityItems.length > 0,
      hasHeroPhoto: !!s.heroPhoto,
      noHeroPhoto: !s.heroPhoto,
      heroPhoto: s.heroPhoto || '',
      heroBg: 'url("' + (s.heroPhoto ? String(s.heroPhoto).replace(/["\\\n\r()]/g, '') : '/assets/hero-bg.jpg') + '")',

      days: days,
      courts: courts,
      slots: slots,
      priceLineWeekday: 'Senin–Jumat: ' + rangeDay + ' ' + fmt(s.priceWeekdayDay) + ' per jam · ' + rangeNight + ' ' + fmt(s.priceWeekdayNight) + ' per jam',
      priceLineWeekend: 'Sabtu–Minggu: ' + rangeDay + ' ' + fmt(s.priceWeekendDay) + ' per jam · ' + rangeNight + ' ' + fmt(s.priceWeekendNight) + ' per jam',

      showSelect: stage === 'select',
      showPay: stage === 'pay' && abSt === 'wait',
      showExpired: stage === 'pay' && abSt === 'expired',
      showTicket: stage === 'ticket',
      showLookup: stage === 'lookup',

      dateLong: this.dateLongOf(dateKey),
      courtName: cname(S.courtIdx),
      hoursText: picked.length ? this.rangesText(picked) : 'Belum dipilih',
      durText: picked.length ? picked.length + ' jam' : '–',
      totalText: fmt(total),
      dpMinText: fmt(dpMin),
      dayTypeText: weekend ? 'Sabtu–Minggu' : 'Senin–Jumat',
      holdText: String(Math.max(1, Number(s.holdMinutes) || 30)),
      name: S.name,
      phone: S.phone,
      onName: (e) => this.setState({ name: e && e.target ? e.target.value : '' }),
      onPhone: (e) => this.setState({ phone: e && e.target ? e.target.value : '' }),
      nameInvalid: !!nameErr,
      phoneInvalid: !!phoneErr,
      hasNameError: !!nameErr,
      nameError: nameErr,
      hasPhoneError: !!phoneErr,
      phoneError: phoneErr,
      hasFormError: !!(S.formError || (!S.loaded && S.netError)),
      formError: S.formError || (!S.loaded ? S.netError : ''),
      startDisabled: picked.length === 0 || !!S.busy,
      startCss: picked.length
        ? 'background:var(--fill);color:var(--onacc);cursor:pointer;'
        : 'background:var(--dim);color:var(--tx3);cursor:not-allowed;',
      startPay: () => this.startPay(),
      openLookup: () => this.setState({ stage: 'lookup', lookupError: '', confirmCancel: false }),

      pay: pay,
      dpOptions: dpOptions,
      dpAmountText: dpAmountText,
      hasBank: hasBank,
      noBank: !hasBank,
      bankLine: bankLine,
      bankHolder: (s.bankHolder || '').trim() || '–',
      hasProof: !!S.proof,
      noProof: !S.proof,
      proofUrl: S.proof,
      proofName: S.proofName,
      hasProofError: !!S.proofError,
      proofError: S.proofError,
      payDisabled: !S.proof || !!S.busy,
      payCss: S.proof
        ? 'background:var(--fill);color:var(--onacc);cursor:pointer;'
        : 'background:var(--dim);color:var(--tx3);cursor:not-allowed;',
      onProof: (e) => {
        const f = e && e.target && e.target.files && e.target.files[0];
        if (!f) return;
        if (f.type.indexOf('image/') !== 0) {
          this.setState({ proof: '', proofName: '', proofError: 'File harus berupa gambar (JPG atau PNG).' });
          return;
        }
        this.readImage(f, 900, 0.72, (url) => {
          if (!url) this.setState({ proof: '', proofName: '', proofError: 'Gambar tidak bisa dibaca. Coba foto atau tangkapan layar lain.' });
          else this.setState({ proof: url, proofName: f.name, proofError: '' });
        });
      },
      submitProof: () => this.submitProof(),
      cancelPay: () => { if (ab) this.cancelBooking(ab.id, 'customer'); this.resetFlow(); },

      tk: tk,
      askingCancel: S.confirmCancel,
      notAskingCancel: !S.confirmCancel,
      askCancel: () => this.setState({ confirmCancel: true }),
      keepBooking: () => this.setState({ confirmCancel: false }),
      doCancel: () => { if (ab) this.cancelBooking(ab.id, 'customer'); this.setState({ confirmCancel: false }); },
      resetAll: () => this.resetFlow(),
      hasPolicy: !!policy,
      policyText: policy,

      lookupCode: S.lookupCode,
      lookupPhone: S.lookupPhone,
      onLookupCode: (e) => this.setState({ lookupCode: e && e.target ? e.target.value : '' }),
      onLookupPhone: (e) => this.setState({ lookupPhone: e && e.target ? e.target.value : '' }),
      hasLookupError: !!S.lookupError,
      lookupError: S.lookupError,
      doLookup: () => this.lookupBooking(),

      courtCards: courtCards,
      courtCountText: String(courtCards.length),
      openShort: hh(s.openHour) + '–' + hh(s.closeHour),
      dpFromText: fmt(Math.min(Number(s.dpWeekday) || 0, Number(s.dpWeekend) || 0)),
      priceFromText: fmt(Math.min(Number(s.priceWeekdayDay) || 0, Number(s.priceWeekdayNight) || 0, Number(s.priceWeekendDay) || 0, Number(s.priceWeekendNight) || 0)),
      noFacilities: facilityItems.length === 0,
      rangeDay: rangeDay,
      rangeNight: rangeNight,
      pWeekdayDay: fmt(s.priceWeekdayDay),
      pWeekdayNight: fmt(s.priceWeekdayNight),
      pWeekendDay: fmt(s.priceWeekendDay),
      pWeekendNight: fmt(s.priceWeekendNight),
      dpWeekdayText: fmt(s.dpWeekday),
      dpWeekendText: fmt(s.dpWeekend),
      facilityItems: facilityItems,

      address: s.address,
      openText: 'Setiap hari, ' + hh(s.openHour) + '–' + hh(s.closeHour),
      waDisplay: this.fmtPhone(waNum),
      waUrl: waBase + encodeURIComponent('Halo ' + brandName + ', saya mau tanya soal booking lapangan futsal.'),
      hasInstagram: !!igHandle,
      igUrl: 'https://instagram.com/' + igHandle,
      igText: '@' + igHandle,
      mapUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address),
      dirUrl: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.address),
    };
  }
}
</script>
</body>
</html>
